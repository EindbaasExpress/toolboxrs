name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on push to the main branch
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # strategy:
    #   matrix:
    #     rust: [stable, nightly] # We will install both stable and nightly versions of Rust

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Rust environment (stable and nightly)
      - name: Set up Rust (Nightly)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

    #   - name: Set up Rust (Stable)
    #     uses: dtolnay/rust-toolchain@stable
    #     with:
    #       toolchain: stable

      # Install Wasm-Pack
      - name: add wasm32-unknown-unknown target
        run: |
            rustup target add wasm32-unknown-unknown

      # Build your Rust crates that do not require wasm-pack (one might need nightly)
      - name: Build Rust Crates
        run: |
          cargo build --release

      # Install Wasm-Pack
      - name: Install Wasm-Pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Build Rust crate with wasm-pack (compile WebAssembly target)
      - name: Build Rust Wasm Crate
        run: |
          cd wasm; wasm-pack build --target bundler --release

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Use your desired node version

      # Install dependencies and build the Svelte Vite project
      - name: Install and Build Frontend
        working-directory: ./wasm/toolboxrs-ui
        run: |
          npm ci  # Clean install dependencies
          npm run build  # Build the Svelte project

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./wasm/toolboxrs-ui/dist

  deploy:
    # Deploy job that runs after the build job is successful
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write  # Grant the job permission to write to GitHub Pages
      id-token: write  # Required for deployment

    steps:
      # Deploy to GitHub Pages using actions/deploy-pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
