cargo-features = ["per-package-target"]

[package]
name = "wasm"
version = "0.1.0"
edition = "2021"
forced-target = "wasm32-unknown-unknown"

# Specify that it's a library crate
[lib]
crate-type = ["cdylib", "rlib"]

# Declare dependencies
[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
log = "=0.4.21"
serde-wasm-bindgen = "0.6.5"
shared = { path = "../shared" }
wasm-bindgen = "0.2.92"
wasm-logger = "0.2.0"
